name: Deploy to Strato

# Lädt die statische Landingpage bei jedem Push auf `main` automatisch
# per SFTP (Port 22) zum Strato-Webspace hoch.
# Strato-Webhosting unterstützt kein FTP/FTPS (Port 21), nur SFTP.
# Manuell auslösbar über den "Run workflow"-Button (workflow_dispatch).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Verhindert parallele Deploys (der zuletzt gestartete gewinnt).
concurrency:
  group: strato-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Konfiguration prüfen
        id: cfg
        env:
          STRATO_FTP_SERVER: ${{ secrets.STRATO_FTP_SERVER }}
        run: |
          if [ -z "$STRATO_FTP_SERVER" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Strato-SFTP-Secrets noch nicht gesetzt – Deploy wird übersprungen. Sobald STRATO_FTP_SERVER/USERNAME/PASSWORD als Secrets hinterlegt sind, läuft der Upload automatisch."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Web-Dateien sammeln
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # Nur die tatsächlich auszuliefernden Dateien in dist/ kopieren
          # (README, .github, Git-Interna bleiben außen vor).
          mkdir -p dist
          cp index.html impressum.html datenschutz.html styles.css robots.txt sitemap.xml .htaccess dist/
          cp -r assets dist/

      # WICHTIG: local_path MUSS auf den *Inhalt* von dist/ zeigen ('./dist/*'),
      # damit die Dateien direkt in den Web-Root landen. Mit './dist/' würde
      # sftp `put -r ./dist/ /` den Ordner selbst hochladen -> /dist/index.html
      # (falscher Pfad, Seite bleibt unverändert).
      - name: Upload zu Strato (SFTP)
        if: steps.cfg.outputs.ready == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.STRATO_FTP_SERVER }}
          username: ${{ secrets.STRATO_FTP_USERNAME }}
          password: ${{ secrets.STRATO_FTP_PASSWORD }}
          port: 22
          local_path: './dist/*'
          remote_path: ${{ vars.STRATO_REMOTE_DIR || '/' }}
          sftp_only: true

      # './dist/*' erfasst keine Dotfiles -> .htaccess separat nachladen.
      - name: Upload .htaccess zu Strato (SFTP)
        if: steps.cfg.outputs.ready == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.STRATO_FTP_SERVER }}
          username: ${{ secrets.STRATO_FTP_USERNAME }}
          password: ${{ secrets.STRATO_FTP_PASSWORD }}
          port: 22
          local_path: './dist/.htaccess'
          remote_path: ${{ vars.STRATO_REMOTE_DIR || '/' }}
          sftp_only: true

      # TEMPORÄR: Live-Seite direkt vom Runner (freier Internetzugang) prüfen.
      - name: DIAG live HTTP checks
        if: steps.cfg.outputs.ready == 'true'
        run: |
          for u in \
            "http://meyerdenker.de/" \
            "https://meyerdenker.de/" \
            "https://meyerdenker.de/impressum.html" \
            "https://meyerdenker.de/datenschutz.html" \
            "https://www.meyerdenker.de/"; do
            echo "===== $u ====="
            curl -sS -o /dev/null -D - -m 25 "$u" 2>&1 | grep -iE '^HTTP/|^location:|^content-type:' || echo "(keine Antwort)"
            echo
          done
